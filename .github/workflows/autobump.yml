# brew tap-new uses this file to generate an autobump workflow for the new tap
name: brew bump

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/autobump.yml
      - .github/scripts/bump-formulae.sh
  # fctl's Release workflow starts this as soon as a release is on fctl.sh:
  # gh workflow run autobump.yml -R hyperstructure/homebrew-tap -f version=0.14.0
  workflow_dispatch:
    inputs:
      version:
        description: Wait until livecheck finds this fctl version, or a newer one
        required: false
  schedule:
    # Every day at 6:15 UTC too, in case a release didn't start it
    - cron: 15 6 * * *

permissions: {}

# One run at a time, so that two don't both propose the same version.
concurrency:
  group: autobump
  cancel-in-progress: false

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  autobump:
    runs-on: ubuntu-latest
    # Most of it is waiting for the pull request's checks (see the script).
    timeout-minutes: 60
    # BUMP_APP_PRIVATE_KEY is a secret of the production environment, which
    # only main may use: on another branch, a workflow could use the app to
    # merge pull requests that no code owner approved.
    environment: production
    permissions:
      # The script reads the pull request's checks with GITHUB_TOKEN, so that
      # the bump app needs no access to checks.
      checks: read
      contents: read
    steps:
      # The bump app, not GITHUB_TOKEN, pushes, opens and merges the pull
      # request: GitHub holds the checks on a pull request that GITHUB_TOKEN
      # opens until a person approves them, and only the app may merge
      # without a code owner's approval (.github/rulesets/main-reviews.json).
      # It is the organization's GitHub App for this, installed on this
      # repository alone, with Contents and Pull requests read and write; its
      # client ID and key are BUMP_APP_CLIENT_ID and BUMP_APP_PRIVATE_KEY in
      # the production environment.
      - name: Create a token for the bump app
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BUMP_APP_CLIENT_ID }}
          private-key: ${{ secrets.BUMP_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1

      - name: Set up git
        uses: Homebrew/actions/git-user-config@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1
        with:
          username: ${{ steps.app-token.outputs.app-slug }}[bot]

      # fctl.sh caches releases/latest for a minute, so just after a release
      # livecheck can still find the version before it.
      - name: Wait for livecheck to find the release
        if: inputs.version
        env:
          FORMULA: ${{ steps.set-up-homebrew.outputs.tap-name }}/fctl
          VERSION: ${{ inputs.version }}
        run: |
          for _ in {1..10}; do
            latest="$(brew livecheck --formula "$FORMULA" --json | jq -r '.[0].version.latest // empty')"
            # A newer version will do: fctl may have released again since.
            if [[ -n "$latest" ]] && printf '%s\n' "${VERSION#v}" "$latest" | sort --version-sort --check=quiet; then
              exit 0
            fi
            sleep 30
          done
          echo "::error::livecheck didn't find fctl ${VERSION#v} or newer in 5 minutes (it found ${latest:-none})."
          exit 1

      # Not `brew bump`, which can't update a formula with an archive per OS
      # and architecture (see the script). It merges each pull request once
      # the checks that main requires pass on it.
      - name: Bump formulae
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CHECKS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: |
          gh auth setup-git
          .github/scripts/bump-formulae.sh "$TAP_NAME" --merge
